# Local stack for the demo: the agent plus Postgres for conversation history.
#   cp .env.example .env    # then fill in your credentials
#   docker compose up       # chat UI at http://localhost:8000

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      # Reachable from this machine only, for psql or running the app outside
      # Docker. Set DB_PORT in .env if something else already uses 5432.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    build: .
    image: connect-ai-agent-quickstart:dev
    env_file: .env
    extra_hosts:
      # Lets a local LLM gateway be reached as host.docker.internal on Linux
      # too; Docker Desktop and Colima already define it.
      - "host.docker.internal:host-gateway"
    ports:
      # This machine only: with APP_API_KEY empty the API needs no key, so it
      # must not be reachable from the rest of the network. Set AGENT_PORT in
      # .env if something else already uses 8000.
      - "127.0.0.1:${AGENT_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Mount the source and reload on change, so edits need no rebuild.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Under --reload a failed startup leaves the container running, so without
    # this `docker compose ps` would look fine. Now it says "unhealthy".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      # Overrides .env so the container reaches the db service, not localhost.
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
      # Poll for changes: file events don't cross the VM boundary on Colima
      # (and some other Docker setups), so --reload would never fire.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/code/app
      # Lets the app watch .env and rebuild the agent when it changes (see app/live.py).
      - .:/workspace

volumes:
  pgdata:
